<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Activitate utilizatori · ORO Network Map</title>
  <style>
    :root{color-scheme:dark;--bg:#061017;--panel:#0b1921;--line:#52e0ff;--accent:#f8c85a;--muted:#9eb0b9;--border:#ffffff1c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef7fa;font:15px/1.45 Inter,ui-sans-serif,system-ui,sans-serif}main{width:min(1280px,calc(100% - 28px));margin:20px auto}.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.top h1{font-size:1.35rem;margin:0 auto 0 0}.button,button,select,input{font:inherit;border-radius:9px;border:1px solid var(--border)}.button,button{padding:8px 11px;color:#07131a;background:var(--accent);font-weight:750;text-decoration:none;cursor:pointer}.button.secondary{color:#eafaff;background:#173642}.filters{display:flex;gap:8px;flex-wrap:wrap;padding:13px;background:var(--panel);border:1px solid var(--border);border-radius:13px;margin-bottom:12px}.filters select,.filters input{padding:8px 10px;color:#fff;background:#08151c}.filters input{min-width:260px}.summary{color:var(--muted);margin:8px 2px 12px}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:13px;background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:820px}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #ffffff10}th{position:sticky;top:0;background:#102832;color:#cfe8f0;font-size:.78rem}td{font-size:.82rem}tr:last-child td{border-bottom:0}.empty{padding:32px;text-align:center;color:var(--muted)}@media(max-width:640px){.filters>*{width:100%}.filters input{min-width:0}}
  </style>
</head>
<body>
<main>
  <div class="top">
    <h1>Activitate utilizatori</h1>
    <a class="button secondary" href="/">Înapoi la hartă</a>
    <a class="button" href="/cdn-cgi/access/logout">Logout</a>
  </div>
  <div class="filters">
    <select id="days" aria-label="Perioadă">
      <option value="1">Ultimele 24 ore</option>
      <option value="7" selected>Ultimele 7 zile</option>
      <option value="30">Ultimele 30 zile</option>
      <option value="90">Ultimele 90 zile</option>
    </select>
    <input id="email" type="search" placeholder="Filtrează după email" aria-label="Filtrează după email">
    <button id="refresh" type="button">Actualizează</button>
    <button id="csv" type="button">Exportă CSV</button>
  </div>
  <p class="summary" id="summary">Se încarcă…</p>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Data și ora</th><th>Utilizator</th><th>Layer</th><th>Element</th><th>ID</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<script>
  const rows=document.getElementById("rows"),summary=document.getElementById("summary"),esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]));let current=[];
  async function load(){summary.textContent="Se încarcă…";const days=document.getElementById("days").value,email=document.getElementById("email").value.trim(),params=new URLSearchParams({days,limit:"2000"});if(email)params.set("email",email);const response=await fetch("/api/activity?"+params,{cache:"no-store"});if(response.status===403){location.replace("/");return}if(!response.ok)throw new Error("Logurile nu au putut fi încărcate");const data=await response.json();current=data.rows||[];summary.textContent=current.length.toLocaleString("ro")+" vizualizări în perioada selectată";rows.innerHTML=current.length?current.map(row=>'<tr><td>'+esc(new Date(row.viewed_at.replace(" ","T")+"Z").toLocaleString("ro-RO"))+'</td><td>'+esc(row.email)+'</td><td>'+esc(row.layer_name||row.layer_id)+'</td><td>'+esc(row.element_name||"—")+'</td><td>'+esc(row.element_id||"—")+'</td></tr>').join(""):'<tr><td class="empty" colspan="5">Nu există vizualizări în perioada selectată.</td></tr>'}
  function csv(){const fields=["viewed_at","email","layer_name","layer_id","element_name","element_id"],quote=value=>'"'+String(value??"").replaceAll('"','""')+'"',content=[fields.join(","),...current.map(row=>fields.map(field=>quote(row[field])).join(","))].join("\r\n"),link=document.createElement("a");link.href=URL.createObjectURL(new Blob(["\ufeff",content],{type:"text/csv;charset=utf-8"}));link.download="oro-activitate.csv";link.click();URL.revokeObjectURL(link.href)}
  document.getElementById("refresh").addEventListener("click",()=>load().catch(error=>summary.textContent=error.message));document.getElementById("days").addEventListener("change",()=>load().catch(error=>summary.textContent=error.message));document.getElementById("csv").addEventListener("click",csv);load().catch(error=>summary.textContent=error.message);
</script>
</body>
</html>
